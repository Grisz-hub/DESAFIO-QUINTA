    <h1 align="center">Cadastro</h1>

    <table align="center" border="1" width="40%">
        <tr>
            <td>
                <form>
                    <p>Nome:</p>
                    <input type="text" name="nome" size="30"><br><br>

                    <p>Email:</p>
                    <input type="email" name="email" size="30"><br><br> <!---campo de email com tamanho 30 e quebra de linha-->

                    <p>Senha:</p>
                    <input type="password" name="senha" size="30"><br><br> <!---campo de senha com tamanho 30 e quebra de linha-->

                    <p>Confirmar senha:</p>
                    <input type="password" name="confirmarSenha" size="30"><br><br> <!---campo de confirmar senha com tamanho 30 e quebra de linha-->

                    <button type="submit">Cadastrar</button>
                </form>
            </td>
        </tr>
    </table>
